name: Optimus Orien Phase 1 checks
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: 'ci-only-isolated-optimus-orien-secret-not-production'
      DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Static release checks
        run: python ../scripts/verify_release.py
      - name: Django system checks
        run: python manage.py check
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Django test suite
        run: python manage.py test core --verbosity 2
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm install
      - name: Validate React/TypeScript build
        run: npm run build
