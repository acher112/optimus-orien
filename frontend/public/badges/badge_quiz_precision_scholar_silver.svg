<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#F1F5F9"/>
            <stop offset="40%" stop-color="#94A3B8"/>
            <stop offset="100%" stop-color="#64748B"/>
        </radialGradient>
        <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F1F5F9"/>
            <stop offset="50%" stop-color="#94A3B8"/>
            <stop offset="100%" stop-color="#334155"/>
        </linearGradient>
        <linearGradient id="diamondGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="50%" stop-color="#818CF8"/>
            <stop offset="100%" stop-color="#C084FC"/>
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
        </filter>
    </defs>

    <!-- Outer Medallion Shadow & Rim -->
    <g filter="url(#shadow)">
        <circle cx="256" cy="256" r="226" fill="url(#rimGrad)" stroke="#334155" stroke-width="4"/>
        <circle cx="256" cy="256" r="214" fill="#2E1065"/>
        <circle cx="256" cy="256" r="202" fill="url(#bgGrad)"/>
        <circle cx="256" cy="256" r="190" fill="#2E1065" opacity="0.15"/>
    </g>

    <!-- Prismatic / Crystal Halo -->
    

    <!-- Central Emblem -->
    <g>
        
        <circle cx="256" cy="256" r="85" fill="#2E1065" opacity="0.7"/>
        <polygon points="256,135 280,225 370,225 297,278 325,365 256,312 187,365 215,278 142,225 232,225" fill="#F1F5F9"/>
        <circle cx="256" cy="256" r="45" fill="#7C3AED"/>
        <path d="M265,200 L235,260 L260,260 L245,310 L285,245 L260,245 Z" fill="#F1F5F9"/>
        
    </g>

    <!-- Star Tier Indicators -->
    <g>
        
        <polygon points="234,385 238,394 248,394 240,401 243,411 234,404 225,411 228,401 220,394 230,394" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
        
        <polygon points="278,385 282,394 292,394 284,401 287,411 278,404 269,411 272,401 264,394 274,394" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
        
